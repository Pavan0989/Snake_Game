<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        
        <!-- Difficulty Selection -->
        <div class="difficulty-selection" id="difficultySelection">
            <h2>Choose Difficulty</h2>
            <div class="difficulty-buttons">
                <button class="difficulty-btn easy" data-difficulty="easy">
                    <span class="difficulty-icon">🟢</span>
                    <span class="difficulty-name">Easy</span>
                </button>
                <button class="difficulty-btn medium" data-difficulty="medium">
                    <span class="difficulty-icon">🟡</span>
                    <span class="difficulty-name">Medium</span>
                </button>
                <button class="difficulty-btn hard" data-difficulty="hard">
                    <span class="difficulty-icon">🔴</span>
                    <span class="difficulty-name">Hard</span>
                </button>
            </div>
        </div>

        <button id="backBtn" class="back-btn" style="display: none;">↩️</button>

        <div class="stats-container" id="statsContainer" style="display: none;">
            <div class="score-container">
                <span class="label">Score:</span>
                <span id="score">0</span>
            </div>
            <div class="high-score-container">
                <span class="label">High Score:</span>
                <span id="highScore">0</span>
            </div>
            <div class="difficulty-display">
                <span class="label">Mode:</span>
                <span id="currentDifficulty">Easy</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="restartBtn" class="restart-btn">🔄 Restart Game</button>
            <button id="pauseBtn" class="pause-btn">⏸️ Pause</button>
            
            <!-- Mobile Controls -->
            <div class="mobile-controls">
                <div class="control-row">
                    <button class="control-btn" data-direction="up">↑</button>
                </div>
                <div class="control-row">
                    <button class="control-btn" data-direction="left">←</button>
                    <button class="control-btn" data-direction="down">↓</button>
                    <button class="control-btn" data-direction="right">→</button>
                </div>
            </div>
            
            <div class="instructions">
                <p><strong>Desktop:</strong> Use arrow keys to control the snake</p>
                <p><strong>Mobile:</strong> Use the directional buttons below</p>
                <p><strong>Controls:</strong> P or SPACE to pause/resume</p>
                <p><strong>Restart:</strong> SPACE when game over or click Restart</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
